<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - TOKO UCEN JAYA</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; color: #f3f4f6; min-height: 100vh; }
        nav { background: #1e3a8a; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2563eb; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .admin-box { background: #1e293b; border: 1px solid #3b82f6; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .admin-title { font-size: 14px; font-weight: 700; color: #93c5fd; text-transform: uppercase; margin-bottom: 15px; border-bottom: 2px solid #2563eb; padding-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #93c5fd; text-transform: uppercase; font-size: 11px; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .form-row { margin-bottom: 12px; }
        .form-row label { display: block; font-size: 11px; font-weight: bold; color: #93c5fd; margin-bottom: 4px; text-transform: uppercase; }
        .form-row input, .form-row textarea, .form-row select { width: 100%; background: #0f172a; border: 1px solid #3b82f6; color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; outline: none; }
    </style>
</head>
<body>

    <nav>
        <div>
            <div style="font-weight:800; font-size:15px; color:#93c5fd;">TOKO UCEN JAYA</div>
            <div style="font-size:10px; color:#93c5fd;">Admin Panel</div>
        </div>
        <div>
            <a href="index.html" class="btn" style="background:#dc2626;">Kembali ke Portal</a>
        </div>
    </nav>

    <div class="container">
        <div style="display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;">
            <button class="btn" onclick="pilihTab('dash')">📊 Statistik</button>
            <button class="btn" onclick="pilihTab('prod')">📦 Kelola Stok</button>
            <button class="btn" onclick="pilihTab('ord')">🛍️ Pesanan Masuk</button>
            <button class="btn" onclick="pilihTab('add')">➕ Tambah Produk</button>
        </div>

        <div id="tab-dash" class="admin-box">
            <div class="admin-title">Dashboard Statistik Pendapatan</div>
            <div style="display:flex; gap:15px; margin-bottom:20px;">
                <div style="flex:1; background:#0f172a; padding:15px; border-radius:6px; border-left:4px solid #3b82f6; border: 1px solid #3b82f6;">
                    <div style="font-size:11px; color:#93c5fd; font-weight:bold;">TOTAL PENDAPATAN</div>
                    <div id="stat-rev" style="font-size:20px; font-weight:bold; color:#60a5fa;">Rp 0</div>
                </div>
            </div>
            <div style="height:200px;"><canvas id="chartAdmin"></canvas></div>
        </div>

        <div id="tab-prod" class="admin-box" style="display:none;">
            <div class="admin-title">Kelola Barang & Stok</div>
            <table>
                <thead><tr><th>Foto</th><th>Nama Barang</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr></thead>
                <tbody id="table-prod-body"></tbody>
            </table>
        </div>

        <div id="tab-ord" class="admin-box" style="display:none;">
            <div class="admin-title">Daftar Pesanan Masuk</div>
            <table>
                <thead><tr><th>ID</th><th>Pembeli</th><th>Item</th><th>Total</th><th>Status</th></tr></thead>
                <tbody id="table-ord-body"></tbody>
            </table>
        </div>

        <div id="tab-add" class="admin-box" style="display:none; max-width:450px;">
            <div class="admin-title">Tambah Produk Baru</div>
            <form onsubmit="tambahProdukBaru(event)">
                <div class="form-row"><label>Nama Barang</label><input type="text" id="p-name" required></div>
                <div class="form-row"><label>Harga (Rp)</label><input type="number" id="p-price" required></div>
                <div class="form-row"><label>Deskripsi</label><textarea id="p-desc" style="height:50px; resize:none;" required></textarea></div>
                <div class="form-row"><label>URL Foto</label><input type="text" id="p-img" placeholder="https://..." required></div>
                <div class="form-row"><label>Stok</label><input type="number" id="p-stock" required></div>
                <button type="submit" class="btn" style="width:100%;">Simpan Produk</button>
            </form>
        </div>
    </div>

    <script>
        function getProducts() {
            return JSON.parse(localStorage.getItem('ucen_products')) || [];
        }
        function getOrders() {
            return JSON.parse(localStorage.getItem('ucen_orders')) || [];
        }

        window.onload = function() {
            loadStats();
            renderChart();
        };

        function pilihTab(tab) {
            ['dash', 'prod', 'ord', 'add'].forEach(t => document.getElementById('tab-'+t).style.display = 'none');
            document.getElementById('tab-'+tab).style.display = 'block';
            if(tab === 'prod') renderProdTable();
            if(tab === 'ord') renderOrdTable();
            if(tab === 'dash') renderChart();
        }

        function loadStats() {
            let orders = getOrders();
            let rev = orders.reduce((a,b)=>a+b.total, 0);
            document.getElementById('stat-rev').innerText = "Rp " + rev.toLocaleString('id-ID');
        }

        function renderChart() {
            loadStats();
            const ctx = document.getElementById('chartAdmin').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'],
                    datasets: [{ label: 'Penjualan', data: [12, 19, 3, 5, 2, 20, 15], backgroundColor: '#3b82f6' }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function renderProdTable() {
            let products = getProducts();
            let tb = document.getElementById('table-prod-body');
            tb.innerHTML = "";
            products.forEach((p, idx) => {
                let img = p.imgs?.[0] || p.img || '';
                tb.innerHTML += `
                    <tr>
                        <td><img src="${img}" style="width:35px; height:35px; object-fit:cover; border-radius:4px;"></td>
                        <td><b>${p.name}</b></td>
                        <td>Rp ${p.price.toLocaleString('id-ID')}</td>
                        <td><b>${p.stock}</b></td>
                        <td><button onclick="hapusProd(${idx})" style="background:#dc2626; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Hapus</button></td>
                    </tr>
                `;
            });
        }

        function hapusProd(idx) {
            let products = getProducts();
            products.splice(idx, 1);
            localStorage.setItem('ucen_products', JSON.stringify(products));
            renderProdTable();
        }

        function renderOrdTable() {
            let orders = getOrders();
            let tb = document.getElementById('table-ord-body');
            tb.innerHTML = "";
            if(orders.length === 0) { tb.innerHTML = "<tr><td colspan='5' style='text-align:center;'>Belum ada pesanan</td></tr>"; return; }
            orders.forEach(o => {
                let items = o.items.map(i => i.name).join(', ');
                tb.innerHTML += `
                    <tr>
                        <td><b>${o.orderId}</b></td>
                        <td>${o.buyer.name}</td>
                        <td>${items}</td>
                        <td><b>Rp ${o.total.toLocaleString('id-ID')}</b></td>
                        <td>${o.status}</td>
                    </tr>
                `;
            });
        }

        function tambahProdukBaru(e) {
            e.preventDefault();
            let products = getProducts();
            products.push({
                id: Date.now(),
                name: document.getElementById('p-name').value,
                price: parseInt(document.getElementById('p-price').value),
                desc: document.getElementById('p-desc').value,
                imgs: [document.getElementById('p-img').value],
                stock: parseInt(document.getElementById('p-stock').value)
            });
            localStorage.setItem('ucen_products', JSON.stringify(products));
            alert("Produk berhasil ditambahkan!");
            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-desc').value = '';
            document.getElementById('p-img').value = '';
            document.getElementById('p-stock').value = '';
            pilihTab('prod');
        }
    </script>
</body>
</html>
