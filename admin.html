<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; }
        header { background: #1e293b; border-bottom: 1px solid #334155; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .adm-logo { font-size: 13px; font-weight: bold; color: #38bdf8; text-transform: uppercase; }
        .adm-nav { display: flex; gap: 6px; }
        .adm-link { background: #334155; color: #cbd5e1; border: none; padding: 6px 10px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: 600; text-decoration: none; }
        .adm-link.active, .adm-link:hover { background: #0284c7; color: #fff; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .card-box { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 15px; margin-bottom: 15px; }
        .card-head { font-size: 11px; font-weight: bold; text-transform: uppercase; color: #38bdf8; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; font-size: 10px; text-align: left; }
        th, td { padding: 8px; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #94a3b8; }
        .f-group { margin-bottom: 8px; }
        .f-group label { display: block; font-size: 9px; font-weight: bold; margin-bottom: 2px; color: #94a3b8; text-transform: uppercase; }
        .f-group input, .f-group textarea, .f-group select { width: 100%; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 6px; border-radius: 4px; font-size: 10px; outline: none; }
        .btn-save { background: #0284c7; color: #fff; border: none; padding: 8px; width: 100%; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div class="adm-logo">Admin Panel Store</div>
        <div class="adm-nav">
            <button class="adm-link active" onclick="gantiTab('dash', event)">Statistik</button>
            <button class="adm-link" onclick="gantiTab('prod', event)">Inventaris</button>
            <button class="adm-link" onclick="gantiTab('ord', event)">Pesanan</button>
            <button class="adm-link" onclick="gantiTab('add', event)">+ Produk</button>
            <a href="index.html" class="adm-link" style="background:#b91c1c; color:#fff;">Logout</a>
        </div>
    </header>

    <div class="container">
        <div id="tab-dash" class="card-box">
            <div style="display:flex; gap:10px; margin-bottom:12px;">
                <div style="flex:1; background:#0f172a; padding:10px; border-radius:4px; border-left:3px solid #38bdf8;">
                    <div style="font-size:9px; color:#94a3b8;">TOTAL PRODUK</div>
                    <div id="st-p" style="font-size:16px; font-weight:bold;">0</div>
                </div>
                <div style="flex:1; background:#0f172a; padding:10px; border-radius:4px; border-left:3px solid #10b981;">
                    <div style="font-size:9px; color:#94a3b8;">TOTAL PENDAPATAN</div>
                    <div id="st-r" style="font-size:16px; font-weight:bold;">Rp 0</div>
                </div>
            </div>
            <div class="card-head">Grafik Kinerja Penjualan</div>
            <div style="height:180px;"><canvas id="myChart"></canvas></div>
        </div>

        <div id="tab-prod" class="card-box" style="display:none;">
            <div class="card-head">Daftar Barang Tersimpan</div>
            <table>
                <thead><tr><th>Media</th><th>Nama & Info</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr></thead>
                <tbody id="tbl-prod"></tbody>
            </table>
        </div>

        <div id="tab-ord" class="card-box" style="display:none;">
            <div class="card-head">Kelola Status Pesanan Pembeli</div>
            <table>
                <thead><tr><th>ID/Waktu</th><th>Pemesan</th><th>Barang</th><th>Total</th><th>Status</th><th>Ubah</th></tr></thead>
                <tbody id="tbl-ord"></tbody>
            </table>
        </div>

        <div id="tab-add" class="card-box" style="display:none; max-width:400px; margin: 0 auto;">
            <div class="card-head">Form Input Produk Baru</div>
            <form onsubmit="simpanProdukBaru(event)">
                <div class="f-group"><label>Nama Produk</label><input type="text" id="i-name" required placeholder="Contoh: Laptop Pro"></div>
                <div class="f-group"><label>Harga (Rp)</label><input type="number" id="i-price" required placeholder="10000000"></div>
                <div class="f-group"><label>Deskripsi Detail</label><textarea id="i-desc" required style="height:45px; resize:none;" placeholder="Spesifikasi..."></textarea></div>
                <div class="f-group"><label>URL Foto (Pisahkan dengan Enter)</label><textarea id="i-img" required style="height:45px; resize:none;" placeholder="https://..."></textarea></div>
                <div class="f-group"><label>URL Video (Pisahkan dengan Enter)</label><textarea id="i-vid" required style="height:45px; resize:none;" placeholder="https://..."></textarea></div>
                <div class="f-group"><label>Stok Awal</label><input type="number" id="i-stock" required placeholder="5"></div>
                <button type="submit" class="btn-save">Simpan Produk ke Database</button>
            </form>
        </div>
    </div>

    <script>
        const DEF = [
            { id: 1, name: "Smartphone Ultra 120Hz", price: 12000000, desc: "Layar AMOLED 120Hz", stock: 10, imgs: ["https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500&q=80"], videos: ["https://www.w3schools.com/html/mov_bbb.mp4"] }
        ];

        function ambilProduk() {
            let d = localStorage.getItem('gs_products');
            if(!d) { localStorage.setItem('gs_products', JSON.stringify(DEF)); return DEF; }
            return JSON.parse(d).map(p => ({ ...p, imgs: p.imgs || [p.img], videos: p.videos || [p.video] }));
        }
        function ambilOrder() { return JSON.parse(localStorage.getItem('gs_orders')) || []; }

        window.onload = () => { muatStatistik(); initChart(); }

        function gantiTab(t, e) {
            document.querySelectorAll('.card-box').forEach(b => b.style.display = 'none');
            document.querySelectorAll('.adm-link').forEach(l => l.classList.remove('active'));
            if(t === 'dash') { document.getElementById('tab-dash').style.display = 'block'; muatStatistik(); }
            else if(t === 'prod') { document.getElementById('tab-prod').style.display = 'block'; muatTabelProduk(); }
            else if(t === 'ord') { document.getElementById('tab-ord').style.display = 'block'; muatTabelOrder(); }
            else if(t === 'add') { document.getElementById('tab-add').style.display = 'block'; }
            if(e) e.target.classList.add('active');
        }

        function muatStatistik() {
            let prods = ambilProduk();
            let ords = ambilOrder();
            document.getElementById('st-p').innerText = prods.length;
            let rev = ords.reduce((a, b) => a + b.total, 0);
            document.getElementById('st-r').innerText = "Rp " + rev.toLocaleString('id-ID');
        }

        function initChart() {
            const ctx = document.getElementById('myChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'],
                    datasets: [{ data: [5, 12, 8, 15, 20, 25, 22], backgroundColor: '#38bdf8', borderRadius: 3 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        function muatTabelProduk() {
            let prods = ambilProduk();
            let tb = document.getElementById('tbl-prod');
            tb.innerHTML = "";
            if(prods.length === 0) { tb.innerHTML = "<tr><td colspan='5' style='text-align:center;'>Kosong</td></tr>"; return; }
            prods.forEach((p, idx) => {
                let img = p.imgs && p.imgs.length > 0 ? p.imgs[0] : '';
                tb.innerHTML += `
                    <tr>
                        <td><img src="${img}" width="25" height="25" style="object-fit:cover; border-radius:2px;"></td>
                        <td><b>${p.name}</b><br><span style="color:#94a3b8;">${p.desc}</span></td>
                        <td>Rp ${p.price.toLocaleString('id-ID')}</td>
                        <td><b>${p.stock}</b></td>
                        <td><button onclick="hapusProd(${idx})" style="background:#dc2626; color:#fff; border:none; padding:2px 6px; border-radius:2px; cursor:pointer;">Hapus</button></td>
                    </tr>
                `;
            });
        }

        function hapusProd(idx) {
            if(confirm("Hapus?")) {
                let p = ambilProduk();
                p.splice(idx, 1);
                localStorage.setItem('gs_products', JSON.stringify(p));
                muatTabelProduk();
            }
        }

        function simpanProdukBaru(e) {
            e.preventDefault();
            let name = document.getElementById('i-name').value;
            let price = parseInt(document.getElementById('i-price').value);
            let desc = document.getElementById('i-desc').value;
            let imgs = document.getElementById('i-img').value.split('\n').map(s => s.trim()).filter(Boolean);
            let videos = document.getElementById('i-vid').value.split('\n').map(s => s.trim()).filter(Boolean);
            let stock = parseInt(document.getElementById('i-stock').value);

            let p = ambilProduk();
            p.push({ id: Date.now(), name, price, desc, imgs, videos, stock });
            localStorage.setItem('gs_products', JSON.stringify(p));
            alert("Tersimpan!");
            e.target.reset();
            gantiTab('prod');
        }

        function muatTabelOrder() {
            let ords = ambilOrder();
            let tb = document.getElementById('tbl-ord');
            tb.innerHTML = "";
            if(ords.length === 0) { tb.innerHTML = "<tr><td colspan='6' style='text-align:center;'>Belum ada pesanan</td></tr>"; return; }
            ords.forEach(o => {
                let items = o.items.map(i => `• ${i.name}`).join("<br>");
                tb.innerHTML += `
                    <tr>
                        <td><b>${o.orderId}</b><br><span style="font-size:8px; color:#94a3b8;">${o.date}</span></td>
                        <td><b>${o.buyer.name}</b> (${o.buyer.phone})</td>
                        <td>${items}</td>
                        <td><b>Rp ${o.total.toLocaleString('id-ID')}</b></td>
                        <td><span style="background:#0369a1; padding:2px 4px; border-radius:2px;">${o.status}</span></td>
                        <td>
                            <select id="st-${o.orderId}" style="padding:2px; font-size:9px; margin-bottom:2px;">
                                <option value="Pesanan Belum Dibayar" ${o.status==='Pesanan Belum Dibayar'?'selected':''}>Belum Dibayar</option>
                                <option value="Pesanan Dikemas" ${o.status==='Pesanan Dikemas'?'selected':''}>Dikemas</option>
                                <option value="Pesanan Dikirim" ${o.status==='Pesanan Dikirim'?'selected':''}>Dikirim</option>
                                <option value="Pesanan Selesai" ${o.status==='Pesanan Selesai'?'selected':''}>Selesai</option>
                            </select>
                            <button onclick="updateSt('${o.orderId}')" style="background:#10b981; color:#fff; border:none; padding:2px; width:100%; border-radius:2px; cursor:pointer;">Update</button>
                        </td>
                    </tr>
                `;
            });
        }

        function updateSt(id) {
            let val = document.getElementById(`st-${id}`).value;
            let ords = ambilOrder();
            let target = ords.find(x => x.orderId === id);
            if(target) {
                target.status = val;
                localStorage.setItem('gs_orders', JSON.stringify(ords));
                muatTabelOrder();
                alert("Status diperbarui!");
            }
        }
    </script>
</body>
</html>
