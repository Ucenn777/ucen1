<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - TOKO UCEN JAYA</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #020617; color: #f8fafc; min-height: 100vh; }
        nav { background: #090d16; color: #fff; padding: 15px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e3a8a; }
        .container { max-width: 1000px; margin: 24px auto; padding: 0 15px; }
        .admin-box { background: #090d16; border: 1px solid #1e3a8a; border-radius: 12px; padding: 22px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .admin-title { font-size: 13px; font-weight: 700; color: #93c5fd; text-transform: uppercase; margin-bottom: 16px; border-bottom: 2px solid #1d4ed8; padding-bottom: 8px; letter-spacing: 0.5px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #1e293b; }
        th { background: #020617; color: #93c5fd; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .form-row { margin-bottom: 12px; }
        .form-row label { display: block; font-size: 11px; font-weight: bold; color: #93c5fd; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-row input, .form-row textarea, .form-row select { width: 100%; background: #020617; border: 1px solid #1d4ed8; color: #fff; padding: 9px 10px; border-radius: 8px; font-size: 12px; outline: none; }
    </style>
</head>
<body>

    <nav>
        <div>
            <div style="font-weight:800; font-size:15px; color:#93c5fd; letter-spacing:0.5px;">TOKO UCEN JAYA</div>
            <div style="font-size:10px; color:#64748b;">Admin Panel - Media Produk</div>
        </div>
        <div>
            <a href="index.html" class="btn" style="background:#1e293b; border:1px solid #334155;">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div style="display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;">
            <button class="btn" onclick="pilihTab('dash')">📊 Statistik</button>
            <button class="btn" onclick="pilihTab('prod')">📦 Kelola Stok</button>
            <button class="btn" onclick="pilihTab('ord')">🛍️ Pesanan Masuk</button>
            <button class="btn" onclick="pilihTab('add')">➕ Tambah Produk</button>
        </div>

        <div id="tab-dash" class="admin-box">
            <div class="admin-title">Dashboard Statistik Pendapatan</div>
            <div style="display:flex; gap:15px; margin-bottom:20px;">
                <div style="flex:1; background:#020617; padding:16px; border-radius:8px; border-left:4px solid #3b82f6; border: 1px solid #1e3a8a;">
                    <div style="font-size:11px; color:#93c5fd; font-weight:bold;">TOTAL PENDAPATAN</div>
                    <div id="stat-rev" style="font-size:22px; font-weight:bold; color:#60a5fa; margin-top:4px;">Rp 0</div>
                </div>
            </div>
            <div style="height:210px;"><canvas id="chartAdmin"></canvas></div>
        </div>

        <div id="tab-prod" class="admin-box" style="display:none;">
            <div class="admin-title">Kelola Barang & Stok Media</div>
            <table>
                <thead><tr><th>Media</th><th>Nama Barang</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr></thead>
                <tbody id="table-prod-body"></tbody>
            </table>
        </div>

        <div id="tab-ord" class="admin-box" style="display:none;">
            <div class="admin-title">Daftar Pesanan Masuk & Status Pengiriman</div>
            <table>
                <thead><tr><th>ID</th><th>Pembeli</th><th>Item</th><th>Total</th><th>Ubah Status</th></tr></thead>
                <tbody id="table-ord-body"></tbody>
            </table>
        </div>

        <div id="tab-add" class="admin-box" style="display:none; max-width:450px;">
            <div class="admin-title">Tambah Produk (Foto/Video)</div>
            <form onsubmit="tambahProdukBaru(event)">
                <div class="form-row"><label>Nama Barang</label><input type="text" id="p-name" required></div>
                <div class="form-row"><label>Harga (Rp)</label><input type="number" id="p-price" required></div>
                <div class="form-row"><label>Deskripsi</label><textarea id="p-desc" style="height:55px; resize:none;" required></textarea></div>
                
                <div class="form-row">
                    <label>Pilih File (Foto / Video)</label>
                    <input type="file" id="p-file" accept="image/*,video/*" required style="padding:6px; cursor:pointer;">
                </div>

                <div class="form-row"><label>Stok</label><input type="number" id="p-stock" required></div>
                <button type="submit" class="btn" style="width:100%; margin-top:4px;">Simpan Produk</button>
            </form>
        </div>
    </div>

    <script>
        function getProducts() {
            return JSON.parse(localStorage.getItem('ucen_products')) || [];
        }
        function getOrders() {
            return JSON.parse(localStorage.getItem('ucen_orders')) || [];
        }

        window.onload = function() {
            loadStats();
            renderChart();
        };

        function pilihTab(tab) {
            ['dash', 'prod', 'ord', 'add'].forEach(t => document.getElementById('tab-'+t).style.display = 'none');
            document.getElementById('tab-'+tab).style.display = 'block';
            if(tab === 'prod') renderProdTable();
            if(tab === 'ord') renderOrdTable();
            if(tab === 'dash') renderChart();
        }

        function loadStats() {
            let orders = getOrders();
            let rev = orders.reduce((a,b)=>a+b.total, 0);
            document.getElementById('stat-rev').innerText = "Rp " + rev.toLocaleString('id-ID');
        }

        function renderChart() {
            loadStats();
            const ctx = document.getElementById('chartAdmin').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'],
                    datasets: [{ label: 'Penjualan', data: [12, 19, 3, 5, 2, 20, 15], backgroundColor: '#3b82f6', borderRadius: 4 }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function renderProdTable() {
            let products = getProducts();
            let tb = document.getElementById('table-prod-body');
            tb.innerHTML = "";
            products.forEach((p, idx) => {
                let mediaElement = "";
                let mediaSrc = p.media || p.imgs?.[0] || p.img || '';
                if(p.mediaType === 'video') {
                    mediaElement = `<video src="${mediaSrc}" style="width:36px; height:36px; object-fit:cover; border-radius:6px; border:1px solid #1e3a8a;" muted></video>`;
                } else {
                    mediaElement = `<img src="${mediaSrc}" style="width:36px; height:36px; object-fit:cover; border-radius:6px; border:1px solid #1e3a8a;">`;
                }

                tb.innerHTML += `
                    <tr>
                        <td>${mediaElement}</td>
                        <td><b>${p.name}</b></td>
                        <td>Rp ${p.price.toLocaleString('id-ID')}</td>
                        <td><b>${p.stock}</b></td>
                        <td><button onclick="hapusProd(${idx})" style="background:#b91c1c; color:#fff; border:none; padding:5px 10px; border-radius:6px; cursor:pointer; font-size:11px;">Hapus</button></td>
                    </tr>
                `;
            });
        }

        function hapusProd(idx) {
            let products = getProducts();
            products.splice(idx, 1);
            localStorage.setItem('ucen_products', JSON.stringify(products));
            renderProdTable();
        }

        function renderOrdTable() {
            let orders = getOrders();
            let tb = document.getElementById('table-ord-body');
            tb.innerHTML = "";
            if(orders.length === 0) { tb.innerHTML = "<tr><td colspan='5' style='text-align:center; color:#64748b;'>Belum ada pesanan</td></tr>"; return; }
            orders.forEach((o, idx) => {
                let items = o.items.map(i => i.name).join(', ');
                tb.innerHTML += `
                    <tr>
                        <td><b>${o.orderId}</b></td>
                        <td>${o.buyer.name}</td>
                        <td>${items}</td>
                        <td><b>Rp ${o.total.toLocaleString('id-ID')}</b></td>
                        <td>
                            <select onchange="ubahStatus(${idx}, this.value)" style="background:#020617; border:1px solid #1e3a8a; color:#fff; padding:5px; border-radius:6px; font-size:11px;">
                                <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Dikirim" ${o.status === 'Dikirim' ? 'selected' : ''}>Sedang Dikirim</option>
                                <option value="Selesai" ${o.status === 'Selesai' ? 'selected' : ''}>Selesai</option>
                            </select>
                        </td>
                    </tr>
                `;
            });
        }

        function ubahStatus(idx, statusBaru) {
            let orders = getOrders();
            orders[idx].status = statusBaru;
            localStorage.setItem('ucen_orders', JSON.stringify(orders));
            loadStats();
            alert("Status pesanan berhasil diubah menjadi: " + statusBaru);
        }

        function tambahProdukBaru(e) {
            e.preventDefault();
            let fileInput = document.getElementById('p-file');
            let file = fileInput.files[0];
            if (!file) return alert("Pilih file terlebih dahulu!");

            let reader = new FileReader();
            reader.onload = function(event) {
                let base64Data = event.target.result;
                let mediaType = file.type.startsWith('video') ? 'video' : 'image';

                let products = getProducts();
                products.push({
                    id: Date.now(),
                    name: document.getElementById('p-name').value,
                    price: parseInt(document.getElementById('p-price').value),
                    desc: document.getElementById('p-desc').value,
                    media: base64Data,
                    mediaType: mediaType,
                    stock: parseInt(document.getElementById('p-stock').value)
                });
                
                localStorage.setItem('ucen_products', JSON.stringify(products));
                alert("Produk & Media berhasil ditambahkan!");
                
                document.getElementById('p-name').value = '';
                document.getElementById('p-price').value = '';
                document.getElementById('p-desc').value = '';
                fileInput.value = '';
                document.getElementById('p-stock').value = '';
                pilihTab('prod');
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
