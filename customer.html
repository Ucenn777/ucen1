<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - Customer Area</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { width: 100%; min-height: 100vh; background-color: #f8f9fa; color: #222; }
        .marquee-container { background: #2563eb; color: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 6px 0; }
        header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 15px 5%; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 12px; }
        .logo { font-size: 16px; font-weight: bold; color: #2563eb; cursor: pointer; text-transform: uppercase; }
        .search-bar { display: flex; align-items: center; border: 1px solid #d1d5db; border-radius: 30px; overflow: hidden; background: #fff; flex: 1; max-width: 350px; }
        .search-bar input { border: none; padding: 8px 14px; outline: none; width: 100%; font-size: 12px; }
        .search-btn { background: #2563eb; color: #fff; border: none; padding: 8px 14px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .header-right { display: flex; gap: 8px; align-items: center; }
        .btn-action-nav { background: #fff; color: #2563eb; border: 1px solid #d1d5db; padding: 7px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer; text-decoration: none; }
        .hero { background: #eff6ff; text-align: center; padding: 25px 20px; border-bottom: 1px solid #dbeafe; }
        .hero h1 { font-size: 18px; font-weight: bold; color: #1e3a8a; margin-bottom: 5px; text-transform: uppercase; }
        .hero p { font-size: 11px; color: #4b5563; }
        .container { max-width: 1300px; margin: 0 auto; padding: 20px; }
        .section-title { font-size: 13px; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; border-left: 4px solid #2563eb; padding-left: 8px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .product-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
        .product-img-wrap { width: 100%; height: 140px; border-radius: 6px; overflow: hidden; background: #f3f4f6; margin-bottom: 8px; }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        .product-video-wrap { width: 100%; height: 110px; border-radius: 6px; overflow: hidden; background: #000; margin-bottom: 8px; }
        .product-video { width: 100%; height: 100%; object-fit: cover; }
        .product-name { font-size: 13px; font-weight: bold; margin-bottom: 3px; color: #1f2937; }
        .product-price { font-size: 14px; font-weight: bold; color: #2563eb; margin-bottom: 5px; }
        .product-desc { font-size: 11px; color: #4b5563; margin-bottom: 6px; background: #f8fafc; padding: 5px; border-radius: 4px; }
        .product-stock { font-size: 10px; color: #6b7280; margin-bottom: 8px; }
        .card-btn-group { display: flex; gap: 5px; }
        .btn-cart-add, .btn-buy-now { flex: 1; padding: 6px; border-radius: 5px; font-size: 10px; font-weight: bold; text-align: center; cursor: pointer; text-decoration: none; }
        .btn-cart-add { background: transparent; color: #2563eb; border: 1px solid #2563eb; }
        .btn-buy-now { background: #2563eb; color: #fff; border: 1px solid #2563eb; }
        .modal-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-box { background: #fff; border-radius: 8px; max-width: 450px; width: 100%; padding: 15px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 10px; right: 10px; background: #eee; border: none; width: 25px; height: 25px; border-radius: 50%; font-weight: bold; cursor: pointer; }
        .form-group { margin-bottom: 10px; text-align: left; }
        .form-group label { display: block; font-size: 10px; font-weight: bold; margin-bottom: 3px; color: #4b5563; text-transform: uppercase; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 7px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 11px; outline: none; }
        .form-group textarea { height: 60px; resize: vertical; }
        .btn-submit-db { background: #2563eb; color: #fff; border: none; padding: 8px; border-radius: 5px; font-size: 11px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="marquee-container">
        <marquee behavior="scroll" direction="left" scrollamount="4">✦ KATALOG GADGETSTORE PRO TERBARU ✦ SILAKAN PILIH PRODUK & BELANJA DENGAN AMAN ✦</marquee>
    </div>
    <header>
        <div class="logo" onclick="location.reload()">GadgetStore Pro</div>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Cari gadget..." oninput="searchProduct()">
            <button class="search-btn" onclick="searchProduct()">Cari</button>
        </div>
        <div class="header-right">
            <button class="btn-action-nav" onclick="openCart()">🛒 Tas (<span id="cart-count">0</span>)</button>
            <a href="index.html" class="btn-action-nav" style="background:#ef4444; color:#fff; border-color:#ef4444;">Keluar</a>
        </div>
    </header>

    <section class="hero">
        <h1>Panel Belanja Pembeli</h1>
        <p>Pilih gadget impianmu lengkap dengan spesifikasi dan video demonstrasi interaktif.</p>
    </section>

    <main class="container">
        <div class="section-title">Daftar Produk Pilihan</div>
        <div class="product-grid" id="customer-product-grid"></div>
    </main>

    <div class="modal-bg" id="cart-modal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('cart-modal')">&times;</button>
            <h3 style="font-size:13px; margin-bottom:10px; font-weight:bold;">Tas Belanja & Checkout</h3>
            <div id="cart-items-box" style="max-height:120px; overflow-y:auto; margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:5px;"></div>
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:12px; font-weight:bold;">
                <span>Total:</span> <span id="cart-total-val" style="color:#2563eb;">Rp 0</span>
            </div>
            <form onsubmit="checkoutOrder(event)">
                <div class="form-group"><label>Nama Lengkap</label><input type="text" id="b-name" required></div>
                <div class="form-group"><label>Nomor HP / WhatsApp</label><input type="tel" id="b-phone" required></div>
                <div class="form-group"><label>Alamat Pengiriman</label><textarea id="b-addr" required></textarea></div>
                <div class="form-group">
                    <label>Metode Pembayaran</label>
                    <select id="b-pay" required>
                        <option value="">-- Pilih --</option>
                        <option value="Transfer Bank">Transfer Bank</option>
                        <option value="E-Wallet">E-Wallet</option>
                        <option value="COD">COD (Bayar di Tempat)</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit-db">Proses Beli Sekarang</button>
            </form>
        </div>
    </div>

    <script>
        const DEFAULT_PRODS = [
            { id: 1, name: "Smartphone Ultra 120Hz", price: 12000000, desc: "Layar AMOLED 120Hz, RAM 12GB, Baterai 5000mAh", stock: 10, img: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500&q=80", video: "https://www.w3schools.com/html/mov_bbb.mp4" },
            { id: 2, name: "Laptop Pro M2", price: 18500000, desc: "Layar Retina 14 inch, Chip M2, SSD 512GB", stock: 5, img: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=500&q=80", video: "https://www.w3schools.com/html/mov_bbb.mp4" }
        ];

        function getProducts() {
            let data = localStorage.getItem('gs_products');
            if(!data) { localStorage.setItem('gs_products', JSON.stringify(DEFAULT_PRODS)); return DEFAULT_PRODS; }
            return JSON.parse(data);
        }
        function saveProducts(p) { localStorage.setItem('gs_products', JSON.stringify(p)); }
        function getCart() { return JSON.parse(localStorage.getItem('gs_cart')) || []; }
        function saveCart(c) { localStorage.setItem('gs_cart', JSON.stringify(c)); }
        function getOrders() { return JSON.parse(localStorage.getItem('gs_orders')) || []; }
        function saveOrders(o) { localStorage.setItem('gs_orders', JSON.stringify(o)); }

        window.addEventListener('load', () => { renderCustomerProducts(); updateCartBadge(); });

        function renderCustomerProducts(list = null) {
            let prods = list || getProducts();
            let grid = document.getElementById('customer-product-grid');
            grid.innerHTML = "";
            if(prods.length === 0) { grid.innerHTML = "<p style='text-align:center; color:#666; grid-column:1/-1;'>Belum ada produk.</p>"; return; }
            prods.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div>
                            <div class="product-img-wrap"><img src="${p.img}" class="product-img"></div>
                            <div class="product-name">${p.name}</div>
                            <div class="product-price">Rp ${p.price.toLocaleString('id-ID')}</div>
                            <div class="product-desc">${p.desc}</div>
                            <div class="product-video-wrap"><video class="product-video" controls src="${p.video}"></video></div>
                            <div class="product-stock">Stok Tersedia: ${p.stock}</div>
                        </div>
                        <div class="card-btn-group">
                            <button class="btn-cart-add" onclick="addToCart(${p.id})">+ Tas</button>
                            <a href="#" class="btn-buy-now" onclick="buyNowDirect(${p.id}); return false;">Beli Sekarang</a>
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            let prods = getProducts();
            let p = prods.find(item => item.id === id);
            if(p && p.stock > 0) {
                let cart = getCart();
                cart.push({ id: p.id, name: p.name, price: p.price });
                saveCart(cart);
                updateCartBadge();
                alert(`${p.name} berhasil dimasukkan ke tas!`);
            } else { alert("Stok barang habis!"); }
        }

        function buyNowDirect(id) { addToCart(id); openCart(); }
        function updateCartBadge() { document.getElementById('cart-count').innerText = getCart().length; }

        function openCart() {
            let cart = getCart();
            let box = document.getElementById('cart-items-box');
            box.innerHTML = "";
            let total = 0;
            if(cart.length === 0) {
                box.innerHTML = "<p style='text-align:center; color:#666; font-size:11px;'>Tas belanja masih kosong.</p>";
            } else {
                cart.forEach((item, idx) => {
                    total += item.price;
                    box.innerHTML += `
                        <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; margin-bottom:5px;">
                            <div><b>${item.name}</b> - Rp ${item.price.toLocaleString('id-ID')}</div>
                            <button onclick="removeCartItem(${idx})" style="background:#ef4444; color:#fff; border:none; padding:2px 5px; border-radius:3px; cursor:pointer;">Hapus</button>
                        </div>
                    `;
                });
            }
            document.getElementById('cart-total-val').innerText = "Rp " + total.toLocaleString('id-ID');
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function removeCartItem(idx) {
            let cart = getCart();
            cart.splice(idx, 1);
            saveCart(cart);
            openCart();
            updateCartBadge();
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function checkoutOrder(e) {
            e.preventDefault();
            let cart = getCart();
            if(cart.length === 0) return;
            let name = document.getElementById('b-name').value;
            let phone = document.getElementById('b-phone').value;
            let address = document.getElementById('b-addr').value;
            let payment = document.getElementById('b-pay').value;

            let prods = getProducts();
            let total = 0;
            cart.forEach(item => {
                total += item.price;
                let pr = prods.find(x => x.id === item.id);
                if(pr && pr.stock > 0) pr.stock -= 1;
            });
            saveProducts(prods);

            let orders = getOrders();
            orders.unshift({
                orderId: 'GS-' + Date.now().toString().slice(-5),
                date: new Date().toLocaleString('id-ID'),
                buyer: { name, phone, address, payment },
                items: cart,
                total: total,
                status: 'Pesanan Belum Dibayar'
            });
            saveOrders(orders);
            saveCart([]);
            updateCartBadge();
            closeModal('cart-modal');
            alert("Pesanan berhasil dikirim ke sistem Admin!");
            renderCustomerProducts();
        }

        function searchProduct() {
            let kw = document.getElementById('search-input').value.toLowerCase();
            renderCustomerProducts(getProducts().filter(p => p.name.toLowerCase().includes(kw) || p.desc.toLowerCase().includes(kw)));
        }
    </script>
</body>
</html>
