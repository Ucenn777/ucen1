<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: radial-gradient(circle at center, #312e81, #0f172a); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: #fff; }
        .box { background: rgba(30, 41, 59, 0.9); border: 1px solid #475569; width: 100%; max-width: 400px; border-radius: 12px; padding: 25px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .btn-role { display: flex; align-items: center; gap: 10px; background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; color: #fff; text-decoration: none; margin-bottom: 10px; text-align: left; cursor: pointer; transition: 0.2s; }
        .btn-role:hover { border-color: #6366f1; background: #1e1b4b; }
    </style>
</head>
<body>
    <div class="box">
        <div style="font-size:35px; margin-bottom:8px;">📱</div>
        <h1 style="font-size:15px; font-weight:bold; margin-bottom:5px; text-transform:uppercase;">GadgetStore Portal</h1>
        <p style="font-size:10px; color:#94a3b8; margin-bottom:20px;">Silakan pilih peran Anda untuk masuk:</p>
        
        <a href="customer.html" class="btn-role">
            <span style="font-size:18px;">🛍️</span>
            <div>
                <div style="font-size:11px; font-weight:bold;">Masuk sebagai Pembeli</div>
                <div style="font-size:9px; color:#94a3b8;">Buka katalog produk & keranjang belanja</div>
            </div>
        </a>

        <a href="admin.html" class="btn-role">
            <span style="font-size:18px;">⚙️</span>
            <div>
                <div style="font-size:11px; font-weight:bold;">Masuk sebagai Pengelola</div>
                <div style="font-size:9px; color:#94a3b8;">Kelola inventaris dan status pesanan</div>
            </div>
        </a>
    </div>
</body>
</html>
