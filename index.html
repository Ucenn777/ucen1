<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Utama - TOKO UCEN JAYA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0b0f19; color: #f3f4f6; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .portal-card { background: #1e293b; border: 1px solid #334155; width: 100%; max-width: 400px; border-radius: 14px; padding: 30px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
        .portal-btn { display: flex; align-items: center; gap: 14px; background: #0f172a; border: 1px solid #475569; padding: 14px; border-radius: 10px; color: #fff; text-decoration: none; margin-bottom: 12px; text-align: left; cursor: pointer; transition: 0.2s; }
        .portal-btn:hover { border-color: #6366f1; background: #162032; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="portal-card">
        <div style="font-size:35px; margin-bottom:10px;">⚡</div>
        <h1 style="font-size:16px; font-weight:800; margin-bottom:5px; text-transform:uppercase;">TOKO UCEN JAYA</h1>
        <p style="font-size:11px; color:#94a3b8; margin-bottom:25px;">Silakan pilih mode akses di bawah ini:</p>
        
        <a href="toko.html?mode=customer" class="portal-btn">
            <span style="font-size:20px;">🛍️</span>
            <div>
                <div style="font-size:12px; font-weight:bold;">Akses Customer</div>
                <div style="font-size:10px; color:#94a3b8;">Belanja produk & checkout pesanan</div>
            </div>
        </a>

        <a href="toko.html?mode=admin" class="portal-btn">
            <span style="font-size:20px;">🛠️</span>
            <div>
                <div style="font-size:12px; font-weight:bold;">Akses Admin Dashboard</div>
                <div style="font-size:10px; color:#94a3b8;">Kelola inventaris, upload media & pesanan</div>
            </div>
        </a>
    </div>
</body>
</html>
