<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal - TOKO UCEN JAYA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; color: #f3f4f6; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .portal-card { background: #1e293b; border: 1px solid #3b82f6; width: 100%; max-width: 380px; border-radius: 12px; padding: 30px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .portal-btn { display: flex; align-items: center; gap: 12px; background: #0f172a; border: 1px solid #3b82f6; padding: 12px; border-radius: 8px; color: #fff; text-decoration: none; margin-bottom: 12px; text-align: left; transition: 0.2s; }
        .portal-btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="portal-card">
        <div style="font-size:30px; margin-bottom:8px;">⚡</div>
        <h1 style="font-size:15px; font-weight:800; margin-bottom:4px; text-transform:uppercase; color:#93c5fd;">TOKO UCEN JAYA</h1>
        <p style="font-size:11px; color:#94a3b8; margin-bottom:20px;">Silakan pilih mode akses di bawah:</p>
        
        <a href="customer.html" class="portal-btn">
            <span style="font-size:18px;">🛍️</span>
            <div>
                <div style="font-size:12px; font-weight:bold; color:#f8fafc;">Akses Customer</div>
                <div style="font-size:10px; color:#93c5fd;">Belanja produk & checkout</div>
            </div>
        </a>

        <a href="admin.html" class="portal-btn">
            <span style="font-size:18px;">🛠️</span>
            <div>
                <div style="font-size:12px; font-weight:bold; color:#f8fafc;">Akses Admin Dashboard</div>
                <div style="font-size:10px; color:#93c5fd;">Kelola stok & pesanan</div>
            </div>
        </a>
    </div>
</body>
</html>
